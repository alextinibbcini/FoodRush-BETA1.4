<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chef Contrarreloj 3D</title>
<style>
  :root {
    --bg: #fff7ed; --bg2: #ffedd5; --panel: #ffffff; --text: #431407;
    --text-dim: #9a3412; --accent: #ea580c; --accent2: #16a34a;
    --danger: #dc2626; --border: #fdba74; color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1210; --bg2: #2a1a12; --panel: #2a1a12; --text: #fef3e2;
      --text-dim: #fdba74; --accent: #fb923c; --accent2: #4ade80;
      --danger: #f87171; --border: #7c2d12; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1210; --bg2:#2a1a12; --panel:#2a1a12; --text:#fef3e2; --text-dim:#fdba74;
    --accent:#fb923c; --accent2:#4ade80; --danger:#f87171; --border:#7c2d12; color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height:100%; margin:0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text); overflow:hidden;
    background: linear-gradient(180deg,var(--bg),var(--bg2));
  }
  body::before { content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; }
  #canvas-wrap { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; }

  #hud { position:fixed; top:0; left:0; right:0; z-index:10;
    padding: calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;
    display:flex; flex-direction:column; gap:8px; }
  .row { display:flex; align-items:center; gap:10px; }
  #timerbar-wrap { flex:1; height:14px; background:var(--panel); border:2px solid var(--border); border-radius:8px; overflow:hidden; }
  #timerbar { height:100%; width:100%; background:var(--accent); transition:width .2s linear, background .2s; }
  #score { font-weight:800; font-size:17px; background:var(--panel); border:2px solid var(--border); border-radius:8px; padding:4px 9px; white-space:nowrap; }
  #lives { font-size:15px; letter-spacing:1px; white-space:nowrap; }
  #level { font-weight:700; font-size:13px; background:var(--panel); border:2px solid var(--border); border-radius:8px; padding:4px 8px; color:var(--accent); white-space:nowrap; }
  #combo { font-size:13px; font-weight:700; color:var(--accent2); min-width:40px; text-align:right; }

  #order-panel { align-self:center; background:var(--panel); border:2px solid var(--border);
    border-radius:14px; padding:7px 14px; display:flex; gap:6px; align-items:center;
    box-shadow:0 4px 14px rgba(0,0,0,.15); min-height:40px; }
  .cust-avatar { font-size:24px; margin-right:2px; }
  .order-item { font-size:26px; opacity:.35; transition:opacity .15s, transform .15s; }
  .order-item.done { opacity:1; transform:scale(1.15); }

  #toast { position:fixed; left:50%; top:112px; transform:translate(-50%,-8px); z-index:15;
    background:var(--panel); border:2px solid var(--border); border-radius:10px; padding:6px 14px;
    font-weight:700; font-size:14px; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; }
  #toast.show { opacity:1; transform:translate(-50%,0); }

  #ingredients { position:fixed; left:0; right:0; bottom:0; z-index:10;
    padding:10px 10px calc(env(safe-area-inset-bottom,0px) + 14px);
    display:grid; grid-template-columns: repeat(4,1fr); gap:8px; }
  .ing-btn { font-size:28px; padding:10px 0; border-radius:14px;
    background:var(--panel); border:2px solid var(--border); box-shadow:0 3px 0 var(--border); }
  .ing-btn:active { transform:translateY(2px); box-shadow:0 1px 0 var(--border); }

  #overlay { position:fixed; inset:0; z-index:20; display:flex; align-items:center;
    justify-content:center; background:rgba(0,0,0,.5); padding:20px; }
  #overlay.hidden { display:none; }
  #overlay-card { background:var(--panel); border:2px solid var(--border); border-radius:18px;
    padding:26px 22px; text-align:center; max-width:320px; width:100%; }
  #overlay-card h1 { margin:0 0 6px; font-size:23px; }
  #overlay-card p { color:var(--text-dim); margin:4px 0 18px; font-size:14px; }
  #overlay-card button { font-size:17px; font-weight:800; padding:12px 26px; border-radius:12px;
    border:none; background:var(--accent); color:#fff; box-shadow:0 3px 0 rgba(0,0,0,.25); }
  #overlay-card button:active { transform:translateY(2px); box-shadow:none; }
  .best { font-size:13px; color:var(--accent2); font-weight:700; margin-top:10px; }
</style>
</head>
<body>
<div id="canvas-wrap"></div>

<div id="hud">
  <div class="row">
    <div id="score">⭐ 0</div>
    <div id="level">Nivel 1</div>
    <div id="lives">❤️❤️❤️</div>
    <div id="timerbar-wrap"><div id="timerbar"></div></div>
    <div id="combo"></div>
  </div>
  <div id="order-panel"></div>
</div>
<div id="toast"></div>

<div id="ingredients"></div>

<div id="overlay">
  <div id="overlay-card">
    <h1>👨‍🍳 Chef Contrarreloj 3D</h1>
    <p>Arma el plato que pide cada cliente antes de que se le acabe la paciencia. Los clientes VIP 👑 pagan el doble, pero aguantan menos. ¡Tienes 3 vidas!</p>
    <button id="startBtn">Empezar a cocinar</button>
    <div class="best" id="bestScore"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  "use strict";

  function getBest(){ try { return parseInt(localStorage.getItem('chef3d_best')||'0',10); } catch(e){ return 0; } }
  function setBest(v){ try { localStorage.setItem('chef3d_best', String(v)); } catch(e){} }

  const ING = [
    {id:'pan', emoji:'🍞'}, {id:'tomate', emoji:'🍅'}, {id:'queso', emoji:'🧀'},
    {id:'lechuga', emoji:'🥬'}, {id:'carne', emoji:'🥩'}, {id:'huevo', emoji:'🥚'},
    {id:'pepino', emoji:'🥒'}, {id:'pimiento', emoji:'🫑'},
  ];

  const wrap = document.getElementById('canvas-wrap');
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
  camera.position.set(0, 4.5, 7.6);
  camera.lookAt(0,0.5,0.8);
  const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth, innerHeight);
  wrap.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xfff2e0, 0x3a2410, 1.1));
  const dl = new THREE.DirectionalLight(0xffffff, 0.9);
  dl.position.set(4,8,5);
  scene.add(dl);

  const counter = new THREE.Mesh(new THREE.BoxGeometry(14,0.6,4), new THREE.MeshStandardMaterial({color:0xb45309}));
  counter.position.y = -1.3;
  scene.add(counter);

  // ---- plate (replaces the old pot) ----
  const plate = new THREE.Group();
  const plateBase = new THREE.Mesh(new THREE.CylinderGeometry(1.15,1.05,0.12,28), new THREE.MeshStandardMaterial({color:0xfffaf0, roughness:0.3}));
  const plateRim = new THREE.Mesh(new THREE.TorusGeometry(1.1,0.07,10,28), new THREE.MeshStandardMaterial({color:0xf4ede0, roughness:0.3}));
  plateRim.rotation.x = Math.PI/2; plateRim.position.y = 0.05;
  plate.add(plateBase, plateRim);
  plate.position.set(0,-0.95,1.4);
  scene.add(plate);
  const plateGlow = new THREE.PointLight(0xffd27a,0,4);
  plateGlow.position.set(0,0.4,1.4);
  scene.add(plateGlow);

  // ---- detailed ingredient models ----
  function addPart(g,geo,color,x,y,z,rx,ry,rz,sx,sy,sz){
    const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color:color, roughness:0.55}));
    m.position.set(x||0,y||0,z||0);
    if(rx||ry||rz) m.rotation.set(rx||0,ry||0,rz||0);
    if(sx||sy||sz) m.scale.set(sx||1,sy||1,sz||1);
    g.add(m); return m;
  }
  function makeModel(id){
    const g = new THREE.Group();
    if(id==='pan'){
      addPart(g,new THREE.BoxGeometry(0.8,0.34,0.6),0xe3b67a,0,-0.08);
      addPart(g,new THREE.SphereGeometry(0.42,12,8,0,Math.PI*2,0,Math.PI/2),0xf3cf9c,0,0.11,0,0,0,0,1,0.55,1);
    } else if(id==='tomate'){
      addPart(g,new THREE.SphereGeometry(0.42,14,14),0xdc2626);
      addPart(g,new THREE.ConeGeometry(0.1,0.18,6),0x16a34a,0,0.46);
    } else if(id==='queso'){
      const w = addPart(g,new THREE.CylinderGeometry(0.5,0.5,0.35,3),0xfacc15);
      w.rotation.z = Math.PI/2; w.rotation.y = Math.PI/7;
      addPart(g,new THREE.SphereGeometry(0.06,8,8),0xd4a81a,0.1,0.08,0.15);
      addPart(g,new THREE.SphereGeometry(0.05,8,8),0xd4a81a,-0.08,-0.05,0.1);
    } else if(id==='lechuga'){
      addPart(g,new THREE.SphereGeometry(0.5,10,8),0x3f9142,0,-0.12,0,0,0,0,1,0.3,1);
      addPart(g,new THREE.SphereGeometry(0.4,10,8),0x4ade80,0,0,0,0,0.5,0,1,0.3,1);
      addPart(g,new THREE.SphereGeometry(0.3,10,8),0x86efac,0,0.1,0,0,1,0,1,0.3,1);
    } else if(id==='carne'){
      addPart(g,new THREE.CylinderGeometry(0.42,0.42,0.22,16),0x8a5a44);
      addPart(g,new THREE.BoxGeometry(0.6,0.02,0.06),0x4a2f22,0,0.12,0.1);
      addPart(g,new THREE.BoxGeometry(0.6,0.02,0.06),0x4a2f22,0,0.12,-0.1);
    } else if(id==='huevo'){
      addPart(g,new THREE.SphereGeometry(0.46,14,10),0xfff7ed,0,-0.1,0,0,0,0,1,0.25,1);
      addPart(g,new THREE.SphereGeometry(0.18,12,12),0xfacc15,0,0.04,0,0,0,0,1,0.55,1);
    } else if(id==='pepino'){
      const b = addPart(g,new THREE.CylinderGeometry(0.28,0.28,0.9,14),0x16a34a);
      b.rotation.z = Math.PI/2;
      const s = addPart(g,new THREE.BoxGeometry(0.9,0.06,0.08),0x86efac);
      s.rotation.z = Math.PI/2; s.position.y = 0.26;
    } else {
      addPart(g,new THREE.SphereGeometry(0.46,14,14),0xea580c,0,0,0,0,0,0,1,1.15,1);
      addPart(g,new THREE.CylinderGeometry(0.06,0.1,0.22,6),0x16a34a,0,0.55);
    }
    return g;
  }

  const meshes = {};
  const spacing = 14/ING.length;
  ING.forEach((it,i)=>{
    const m = makeModel(it.id);
    m.userData.baseX = -7 + spacing*i + spacing/2;
    m.position.set(m.userData.baseX, -0.7, -0.3);
    m.userData.baseY = m.position.y;
    m.userData.anim = 0;
    scene.add(m);
    meshes[it.id] = m;
  });

  // ---- customer ----
  function disposeGroup(g){
    g.traverse(o=>{ if(o.isMesh){ o.geometry.dispose(); o.material.dispose(); } });
  }
  function buildCustomer(vip){
    // Every +z offset below sits on the side facing the camera/chef, so the
    // whole figure clearly reads as a person looking straight at the counter.
    const g = new THREE.Group();
    const shirtColors = [0xf87171,0x60a5fa,0xfbbf24,0xa78bfa,0x34d399,0xf472b6];
    const skinColors = [0xf1c27d,0xe0ac69,0xc68642,0x8d5524,0xffdbac];
    const hairColors = [0x2b1a12,0x4a2f22,0x6b4423,0x1c1210,0xb8860b];
    const shirt = vip ? 0xfacc15 : shirtColors[Math.floor(Math.random()*shirtColors.length)];
    const skin = skinColors[Math.floor(Math.random()*skinColors.length)];
    const hair = hairColors[Math.floor(Math.random()*hairColors.length)];
    addPart(g,new THREE.CylinderGeometry(0.42,0.55,1.1,12),shirt,0,0.55);
    const armL = addPart(g,new THREE.CylinderGeometry(0.09,0.09,0.55,8),shirt,-0.52,0.72,0);
    armL.rotation.z = 0.35;
    const armR = addPart(g,new THREE.CylinderGeometry(0.09,0.09,0.55,8),shirt,0.52,0.72,0);
    armR.rotation.z = -0.35;
    addPart(g,new THREE.SphereGeometry(0.38,16,16),skin,0,1.35);
    addPart(g,new THREE.SphereGeometry(0.4,14,10,0,Math.PI*2,0,Math.PI/2.1),hair,0,1.44,0,0,0,0,1,0.8,1);
    addPart(g,new THREE.SphereGeometry(0.06,8,8),0x1c1210,-0.14,1.4,0.34);
    addPart(g,new THREE.SphereGeometry(0.06,8,8),0x1c1210,0.14,1.4,0.34);
    addPart(g,new THREE.BoxGeometry(0.16,0.04,0.03),0x7a3b2e,0,1.21,0.37);
    if(vip) addPart(g,new THREE.ConeGeometry(0.22,0.22,5),0xfde047,0,1.82);
    g.userData.vip = !!vip;
    return g;
  }
  let customer = buildCustomer(false);
  customer.position.set(0,-1.3,3.1);
  scene.add(customer);

  function slideCustomer(toX,dur,cb){
    const startX = customer.position.x, t0 = performance.now();
    function step(now){
      const p = Math.min(1,(now-t0)/dur);
      customer.position.x = startX + (toX-startX)*(1-Math.pow(1-p,3));
      if(p<1) requestAnimationFrame(step); else if(cb) cb();
    }
    requestAnimationFrame(step);
  }
  function reactCustomer(happy){
    const dur=380, t0=performance.now();
    function step(now){
      const p = Math.min(1,(now-t0)/dur);
      customer.scale.setScalar(happy ? 1+Math.sin(p*Math.PI)*0.18 : 1);
      customer.rotation.z = happy ? 0 : Math.sin(p*Math.PI*6)*0.08;
      if(p<1) requestAnimationFrame(step); else { customer.scale.setScalar(1); customer.rotation.z=0; }
    }
    requestAnimationFrame(step);
  }

  let level = 1;
  let t = 0;
  function animate(){
    requestAnimationFrame(animate);
    t += 0.016 * (1 + level*0.025);
    ING.forEach((it,i)=>{
      const m = meshes[it.id];
      m.rotation.y += 0.01;
      m.position.y = m.userData.baseY + Math.sin(t*1.5+i)*0.06;
    });
    plateGlow.intensity = Math.max(0, plateGlow.intensity - 0.04);
    if(customer) customer.position.y = -1.3 + Math.sin(t*2)*0.04;
    renderer.render(scene, camera);
  }
  animate();

  addEventListener('resize', ()=>{
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  // animTo() carries a per-mesh token so an older (stale) tween can never
  // overwrite a newer one - fixes a glitch where a failed order could leave
  // an ingredient stuck mid-air after a late animation frame landed.
  function animTo(m, target, dur, scaleTo, onDone){
    if(!m) return;
    const token = ++m.userData.anim;
    const start = m.position.clone(), s0 = m.scale.x;
    const t0 = performance.now();
    function step(now){
      if(m.userData.anim !== token) return;
      const p = Math.min(1,(now-t0)/dur);
      m.position.lerpVectors(start,target,p);
      m.scale.setScalar(s0 + (scaleTo-s0)*p);
      if(p<1) requestAnimationFrame(step); else if(onDone) onDone(m);
    }
    requestAnimationFrame(step);
  }
  function homeMesh(m){
    if(!m) return;
    m.userData.anim++;
    m.position.set(m.userData.baseX,-0.7,-0.3);
    m.scale.setScalar(1);
  }

  const RECIPES = [
    ['pan','tomate'], ['pan','queso','lechuga'], ['tomate','queso'],
    ['pan','carne','lechuga'], ['huevo','pan'], ['pepino','tomate','pimiento'],
    ['queso','pimiento'], ['carne','queso','pan'], ['lechuga','pepino','tomate'],
  ];

  const ingWrap = document.getElementById('ingredients');
  const orderPanel = document.getElementById('order-panel');
  const scoreEl = document.getElementById('score');
  const levelEl = document.getElementById('level');
  const livesEl = document.getElementById('lives');
  const comboEl = document.getElementById('combo');
  const timerbar = document.getElementById('timerbar');
  const overlay = document.getElementById('overlay');
  const toastEl = document.getElementById('toast');
  document.getElementById('bestScore').textContent = 'Mejor puntaje: ' + getBest();

  let toastTimer=null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>toastEl.classList.remove('show'),1100);
  }
  let actx=null;
  function beep(freq,dur,type){
    try{
      if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
      const o=actx.createOscillator(), v=actx.createGain();
      o.type=type||'sine'; o.frequency.value=freq;
      v.gain.value=0.08;
      o.connect(v); v.connect(actx.destination);
      o.start();
      v.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+dur);
      o.stop(actx.currentTime+dur);
    }catch(e){}
  }
  function renderLives(){ livesEl.textContent = '❤️'.repeat(lives) + '🤍'.repeat(maxLives-lives); }

  const maxLives = 3;
  let score=0, combo=0, lives=maxLives, timeLeft=0, maxTime=16, order=[], done=[], running=false, busy=false, loopId=null, lastTier=-1;
  function lvlDur(base){ return Math.max(180, base - level*14); }

  ING.forEach(it=>{
    const b = document.createElement('button');
    b.className='ing-btn'; b.textContent=it.emoji; b.dataset.id=it.id;
    b.addEventListener('click', ()=>onTap(it.id));
    ingWrap.appendChild(b);
  });

  function newOrder(){
    const vip = customer.userData.vip;
    const base = RECIPES[Math.floor(Math.random()*RECIPES.length)];
    order = [...base]; done = [];
    orderPanel.innerHTML='';
    const av = document.createElement('span'); av.className='cust-avatar';
    av.textContent = vip ? '👑' : '🙂';
    orderPanel.appendChild(av);
    order.forEach(id=>{
      const span=document.createElement('span');
      span.className='order-item'; span.textContent = ING.find(i=>i.id===id).emoji;
      span.dataset.id=id;
      orderPanel.appendChild(span);
    });
    const tier = Math.floor(score/100);
    level = tier+1;
    levelEl.textContent = 'Nivel '+level;
    if(tier>lastTier && lastTier>=0) toast('🔥 ¡Nivel '+level+'! Todo más rápido');
    lastTier = tier;
    maxTime = Math.max(vip?4:6, (vip?13:18) - tier*1.4);
    timeLeft = maxTime;
    busy = false;
    beep(vip?880:660, vip?0.18:0.12, vip?'triangle':'sine');
  }

  function onTap(id){
    if(!running || busy) return;
    if(order.includes(id) && !done.includes(id)){
      done.push(id);
      const ox=(Math.random()-0.5)*1.2, oz=(Math.random()-0.5)*0.9;
      animTo(meshes[id], new THREE.Vector3(plate.position.x+ox,-0.6,plate.position.z+oz), 300, 0.6);
      plateGlow.intensity = 1.4;
      const el = orderPanel.querySelector('[data-id="'+id+'"]');
      if(el) el.classList.add('done');
      combo++;
      const mult = customer.userData.vip ? 2 : 1;
      score += (10 + combo*2) * mult;
      timeLeft = Math.min(maxTime, timeLeft + 1);
      comboEl.textContent = combo>1 ? 'x'+combo : '';
      scoreEl.textContent = '⭐ '+score;
      if(done.length===order.length) serveOrder();
    } else {
      combo = 0; comboEl.textContent='';
      timeLeft = Math.max(0, timeLeft - 1.5);
      if(navigator.vibrate) navigator.vibrate(60);
      beep(180,0.1,'square');
    }
  }

  function serveOrder(){
    busy = true;
    const mult = customer.userData.vip ? 2 : 1;
    const bonus = (10 + combo*3) * mult;
    toast((customer.userData.vip ? '👑 ¡Pedido VIP! +' : '😋 ¡Gracias! +')+bonus);
    score += bonus;
    scoreEl.textContent = '⭐ '+score;
    reactCustomer(true);
    beep(988,0.1); setTimeout(()=>beep(1318,0.14),90);
    done.forEach(id=>{
      animTo(meshes[id], new THREE.Vector3(customer.position.x,0.4,customer.position.z-0.3), 320, 0, homeMesh);
    });
    setTimeout(()=>{ slideCustomer(6,lvlDur(380),()=>nextCustomer(-6)); }, 260);
  }

  function failOrder(){
    busy = true;
    lives = Math.max(0, lives-1);
    renderLives();
    toast('😠 El cliente se fue sin comer');
    reactCustomer(false);
    beep(140,0.25,'sawtooth');
    done.forEach(id=>homeMesh(meshes[id]));
    combo = 0; comboEl.textContent='';
    if(lives<=0){ setTimeout(gameOver, 500); return; }
    setTimeout(()=>{ slideCustomer(-6,lvlDur(380),()=>nextCustomer(6)); }, 500);
  }

  function nextCustomer(fromX){
    scene.remove(customer);
    disposeGroup(customer);
    const vipChance = Math.min(0.35, 0.08 + score/500);
    customer = buildCustomer(Math.random() < vipChance);
    customer.position.set(fromX,-1.3,3.1);
    scene.add(customer);
    slideCustomer(0,lvlDur(420));
    newOrder();
  }

  function tick(){
    if(!running) return;
    if(!busy){
      timeLeft -= 0.05;
      const pct = Math.max(0,timeLeft/maxTime);
      timerbar.style.width = (pct*100)+'%';
      timerbar.style.background = pct<0.25 ? 'var(--danger)' : 'var(--accent)';
      if(timeLeft<=0) failOrder();
    }
    loopId = setTimeout(tick, 50);
  }

  function startGame(){
    score=0; combo=0; lives=maxLives; level=1; running=true; busy=false; lastTier=-1;
    scoreEl.textContent='⭐ 0'; comboEl.textContent=''; levelEl.textContent='Nivel 1'; renderLives();
    overlay.classList.add('hidden');
    scene.remove(customer);
    disposeGroup(customer);
    customer = buildCustomer(false);
    customer.position.set(0,-1.3,3.1);
    scene.add(customer);
    newOrder();
    tick();
  }

  function gameOver(){
    running = false;
    clearTimeout(loopId);
    const best = Math.max(score, getBest());
    setBest(best);
    overlay.classList.remove('hidden');
    document.getElementById('overlay-card').innerHTML =
      '<h1>🚪 ¡Cerraste el restaurante por menso!</h1><p>Puntaje: <strong>'+score+'</strong></p>'+
      '<button id="startBtn">Abrir de nuevo</button>'+
      '<div class="best">Mejor puntaje: '+best+'</div>';
    document.getElementById('startBtn').addEventListener('click', startGame);
  }

  document.getElementById('startBtn').addEventListener('click', startGame);
})();
</script>
</body>
</html>
